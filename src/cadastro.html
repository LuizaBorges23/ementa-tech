            <form class="form-container">
    <label for="username">Usuario</label>
    <input type="text" name="username" [(ngModel)]="username" placeholder="admin" />

    <label for="senha">Senha</label>
    <input type="password" name="senha" [(ngModel)]="senha" placeholder="admin123" />

    <button type="button" (click)="aoEntrar()" class="btn-entrar">Entrar</button>
</form>
